<style>
  :root{
    --navy:#052436; --deep:#03161f; --cyan:#22d3ee; --teal:#2ab7d9;
    --coral:#ff6b4a; --gold:#ffd24a; --foam:#eafcff;
    --slate:#8fb6c6;
  }
  *{box-sizing:border-box;}
  #stage{
    position:fixed; inset:0; background:#03161f;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--foam);
  }
  #game{
    display:block;
    width:min(100vw, calc(100vh * 1.6));
    height:min(100vh, calc(100vw / 1.6));
    background:#03161f;
    touch-action:none;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center;
    background:radial-gradient(ellipse at 50% 35%, rgba(9,52,74,.72), rgba(3,14,20,.94));
    backdrop-filter:blur(3px);
    padding:24px;
  }
  .overlay.hidden{display:none;}
  .logo{
    font-family:"Arial Black","Helvetica Neue",Impact,sans-serif;
    font-style:italic; font-weight:900;
    font-size:clamp(38px,8vw,86px); line-height:.92;
    letter-spacing:-1px; text-transform:uppercase;
    background:linear-gradient(180deg,#fff 0%,var(--gold) 45%,var(--coral) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(255,107,74,.35)) drop-shadow(0 10px 22px rgba(0,0,0,.5));
    text-wrap:balance;
  }
  .tag{ color:var(--cyan); font-weight:bold; letter-spacing:3px; text-transform:uppercase; font-size:clamp(11px,1.6vw,15px); }
  .sub{ color:var(--slate); max-width:52ch; line-height:1.5; font-size:clamp(13px,1.8vw,16px); }
  .keys{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
  .keys b{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    padding:8px 14px; border-radius:12px; font-weight:normal; color:var(--foam); font-size:14px;
  }
  kbd{
    background:linear-gradient(180deg,#123c50,#08252f);
    border:1px solid rgba(255,255,255,.22); border-bottom-width:3px;
    border-radius:8px; padding:3px 9px; font-family:inherit; font-weight:bold; color:var(--foam);
  }
  input#name{
    width:min(360px,80vw); font-size:20px; text-align:center;
    padding:14px 16px; border-radius:14px;
    background:rgba(255,255,255,.06); color:#fff;
    border:2px solid rgba(34,211,238,.5); outline:none;
    font-family:inherit; letter-spacing:1px;
  }
  input#name:focus{ border-color:var(--cyan); box-shadow:0 0 0 4px rgba(34,211,238,.18); }
  button.btn{
    font-family:"Arial Black",sans-serif; font-style:italic; font-weight:900;
    text-transform:uppercase; letter-spacing:1px;
    font-size:clamp(18px,2.4vw,24px);
    color:#04202b; cursor:pointer;
    background:linear-gradient(180deg,var(--gold),var(--coral));
    border:none; border-radius:16px; padding:16px 40px;
    box-shadow:0 6px 0 #b23a22, 0 14px 26px rgba(0,0,0,.45);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  button.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b23a22, 0 8px 14px rgba(0,0,0,.4); }
  button.btn:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
  button.ghost{
    background:transparent; color:var(--cyan);
    box-shadow:none; border:2px solid rgba(34,211,238,.5);
    font-size:15px; padding:11px 22px;
  }
  button.ghost:active{ transform:translateY(2px); box-shadow:none; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; }

  /* Game-over / leaderboard */
  .result{ font-family:"Arial Black",sans-serif; font-style:italic; font-size:clamp(30px,6vw,64px);
           background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bignum{ font-size:clamp(40px,9vw,80px); font-weight:900; font-family:"Arial Black",sans-serif;
           color:var(--foam); line-height:1; }
  .newhi{ color:var(--gold); font-weight:bold; letter-spacing:2px; text-transform:uppercase; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.4} }
  .board{
    width:min(460px,90vw); background:rgba(4,26,36,.6);
    border:1px solid rgba(34,211,238,.25); border-radius:16px; padding:10px 6px;
    max-height:38vh; overflow-y:auto;
  }
  .board h3{ margin:6px 0 10px; color:var(--cyan); letter-spacing:2px; text-transform:uppercase; font-size:13px; }
  .lb{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center;
       padding:7px 14px; font-size:16px; }
  .lb+.lb{ border-top:1px solid rgba(255,255,255,.06); }
  .lb .rk{ color:var(--slate); font-weight:bold; text-align:right; }
  .lb .nm{ text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb .sc{ font-weight:bold; font-variant-numeric:tabular-nums; color:var(--gold); }
  .lb.me{ background:rgba(255,210,74,.12); border-radius:8px; }
  .lb.me .nm{ color:#fff; }
  .lb.gold .rk{ color:var(--gold); }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;} }
</style>

<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>

  <!-- START -->
  <div id="startScreen" class="overlay">
    <div class="tag">Jetski · Wave Racer</div>

    <input id="name" maxlength="14" placeholder="Dein Name" autocomplete="off" spellcheck="false">

      <b><kbd>◀</kbd><kbd>▶</kbd> Lenken</b>

    </div>

<script>
(function(){
"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---------- Balance / Konstanten ----------
const GAME_TIME = 45;
const HORIZON   = H * 0.40;
const CAMH_FOCAL = 84000;      // CAM_H * FOCAL  (steuert Höhe der Wasserfläche)
const FOCAL     = 300;
const PLAYER_DZ = 310;         // Distanz Jetski vor der Kamera
const FAR       = 2200;        // Spawn-Distanz
const SPEED     = 1250;        // konstante Vorwärtsgeschwindigkeit (Welt-Einheiten/s)
const STEER     = 1500;        // Lenkgeschwindigkeit
const COURSE_HW = 1700;        // halbe Kursbreite
const GATE_HALF = 300;         // halber Torabstand (Bojen bei ±)
const GAP       = 560;         // Weltabstand zwischen Kurs-Elementen

const LB_KEY = 'waveRushBoard.v1';

// ---------- Zustand ----------
let state = 'menu';
let playerName = '';
let px, timeLeft, score, streak, dist, spawnAcc, objs, particles, texts;
let air, airT, bob, camShake;
let keys = {};

function project(dz, dx){
  const scale = FOCAL / dz;
  return {
    sx: W/2 + dx * scale,
    sy: HORIZON + CAMH_FOCAL / dz,
    scale
  };
}

function reset(){
  px = 0; timeLeft = GAME_TIME; score = 0; streak = 0;
  dist = 0; spawnAcc = GAP; objs = []; particles = []; texts = [];
  air = 0; airT = 0; bob = 0; camShake = 0;
  // Startfeld vorab füllen
  for(let z = FAR; z > PLAYER_DZ+200; z -= GAP) spawnAt(z, true);
}

let pattern = 0;
function spawnAt(dz, warmup){
  // Kursrand-Marker immer
  const t = (warmup ? Math.floor(Math.random()*100) : pattern++);
  const kind = pickKind(t);
  if(kind === 'gate'){
    const cx = rand(-(COURSE_HW-500), COURSE_HW-500);
    objs.push({type:'gate', dz, x:cx, done:false});
  } else if(kind === 'ring'){
    // kleine Reihe Ringe
    const cx = rand(-(COURSE_HW-300), COURSE_HW-300);
    objs.push({type:'ring', dz, x:cx, done:false, ph:Math.random()*6});
  } else if(kind === 'ramp'){
    const cx = rand(-700, 700);
    objs.push({type:'ramp', dz, x:cx, done:false});
  } else if(kind === 'rock'){
    const n = 1 + (Math.random()<0.4?1:0);
    for(let i=0;i<n;i++)
      objs.push({type:'rock', dz:dz - i*40, x:rand(-(COURSE_HW-250), COURSE_HW-250), done:false, r:Math.random()});
  } else if(kind === 'star'){
    objs.push({type:'star', dz, x:rand(-800,800), done:false, ph:Math.random()*6});
  }
}
function pickKind(t){
  // gewichtete Abfolge, viel Abwechslung
  const seq = ['gate','ring','rock','gate','star','ramp','gate','ring','rock','gate','ring','rock','star','gate','ramp'];
  return seq[((t%seq.length)+seq.length)%seq.length];
}
function rand(a,b){ return a + Math.random()*(b-a); }

// ---------- Eingabe ----------
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyA') keys.ArrowLeft = true;
  if(e.code==='KeyD') keys.ArrowRight = true;
});
addEventListener('keyup', e=>{
  keys[e.code] = false;
  if(e.code==='KeyA') keys.ArrowLeft = false;
  if(e.code==='KeyD') keys.ArrowRight = false;
});
// Touch: linke/rechte Hälfte
cv.addEventListener('pointerdown', e=>{
  const r = cv.getBoundingClientRect();
  keys._t = ((e.clientX-r.left)/r.width < 0.5) ? 'L':'R';
});
addEventListener('pointerup', ()=>{ keys._t = null; });

// ---------- Loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if(state==='play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; endGame(); return; }

  dist += SPEED*dt;
  bob += dt*4;

  // Lenken (mit etwas Trägheit)
  let dir = 0;
  if(keys.ArrowLeft  || keys._t==='L') dir -= 1;
  if(keys.ArrowRight || keys._t==='R') dir += 1;
  px += dir * STEER * dt;
  px = Math.max(-COURSE_HW, Math.min(COURSE_HW, px));

  // Sprung/Airtime
  if(air > 0){ air -= dt; airT += dt; if(air<0) air=0; }
  if(camShake>0) camShake -= dt;

  // Nachschub
  spawnAcc -= SPEED*dt;
  while(spawnAcc <= 0){ spawnAt(FAR); spawnAcc += GAP; }

  // Objekte bewegen + Kollision
  for(const o of objs){
    o.dz -= SPEED*dt;
    if(!o.done && o.dz <= PLAYER_DZ){
      o.done = true;
      resolve(o);
    }
  }
  objs = objs.filter(o => o.dz > 120);

  // Wake-Partikel
  const pj = project(PLAYER_DZ, px - px); // player screen pos base
  const pyBase = pj.sy;
  if(Math.random()<0.95 && air<=0){
    particles.push({x:W/2 + rand(-30,30), y:pyBase+8, life:.55, r:rand(4,11), vy:rand(30,70), vx:rand(-40,40)});
  }
  particles.forEach(p=>{ p.life-=dt; p.y+=p.vy*dt; p.x+=p.vx*dt; p.vy+=200*dt; });
  particles = particles.filter(p=>p.life>0);
}

function resolve(o){
  const dx = Math.abs(o.x - px);
  if(o.type==='gate'){
    if(dx < GATE_HALF){
      streak++;
      let g = 100 + Math.floor(streak/3)*25;
      if(dx < 40){ g += 50; pop('PERFEKT +'+g, '#ffd24a'); } else pop('+'+g, '#8ff0a4');
      score += g;
      burst(o.x, '#8ff0a4');
    } else { streak = 0; pop('DANEBEN', '#ff6b6b'); }
  } else if(o.type==='ring'){
    if(dx < 210){ score += 40; pop('+40', '#22d3ee'); burst(o.x,'#22d3ee'); }
  } else if(o.type==='star'){
    if(dx < 200){ score += 75; streak++; pop('★ +75', '#ffd24a'); burst(o.x,'#ffd24a'); }
  } else if(o.type==='ramp'){
    if(dx < 260){ air = 1.15; airT = 0; pop('BIG AIR!', '#ffd24a'); score += 60; }
  } else if(o.type==='rock'){
    if(dx < 200 && air<=0){ streak = 0; score = Math.max(0, score-30); camShake = .4; pop('-30 💥','#ff5252'); burst(o.x,'#ff8a5c'); }
  }
}

function pop(t,c){ texts.push({t,c,x:W/2,y:HORIZON+150,life:1}); }
function burst(worldX,c){
  const p = project(PLAYER_DZ+10, worldX-px);
  for(let i=0;i<14;i++)
    particles.push({x:p.sx,y:p.sy,life:.5,r:rand(3,7),vy:rand(-160,-40),vx:rand(-140,140), c});
}

// ---------- Zeichnen ----------
function draw(){
  const shX = camShake>0 ? rand(-6,6)*camShake*2.5 : 0;
  const shY = camShake>0 ? rand(-6,6)*camShake*2.5 : 0;
  ctx.save();
  ctx.translate(shX, shY);
  drawSky();
  drawWater();
  drawSideMarkers();

  // Objekte: fern → nah
  const sorted = objs.slice().sort((a,b)=>b.dz-a.dz);
  for(const o of sorted) drawObj(o);

  drawParticles();
  if(state!=='menu') drawPlayer();

  // schwebende Texte
  ctx.textAlign='center';
  texts.forEach(tx=>{
    ctx.globalAlpha=Math.max(0,tx.life);
    ctx.fillStyle=tx.c; ctx.font='900 italic 34px "Arial Black",sans-serif';
    ctx.fillText(tx.t, tx.x, tx.y); tx.y-=1.4; tx.life-=.018;
  });
  texts = texts.filter(t=>t.life>0);
  ctx.globalAlpha=1;
  ctx.restore();

  if(state==='play') drawHUD();
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,'#123a63'); g.addColorStop(.55,'#3d6b93');
  g.addColorStop(.8,'#e78a5a'); g.addColorStop(1,'#ffd58a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HORIZON+2);
  // Sonne
  ctx.fillStyle='rgba(255,240,190,.95)';
  ctx.beginPath(); ctx.arc(W*0.5, HORIZON-38, 46, 0, 7); ctx.fill();
  ctx.fillStyle='rgba(255,220,150,.25)';
  ctx.beginPath(); ctx.arc(W*0.5, HORIZON-38, 78, 0, 7); ctx.fill();
  // Hügel-Silhouette am Horizont
  ctx.fillStyle='#0d3b4a';
  ctx.beginPath(); ctx.moveTo(0,HORIZON);
  for(let x=0;x<=W;x+=40){ ctx.lineTo(x, HORIZON - 18*Math.abs(Math.sin(x*0.01+2)) - 6); }
  ctx.lineTo(W,HORIZON); ctx.closePath(); ctx.fill();
}

function drawWater(){
  const g = ctx.createLinearGradient(0,HORIZON,0,H);
  g.addColorStop(0,'#0e5a72'); g.addColorStop(.5,'#0a3f57'); g.addColorStop(1,'#052030');
  ctx.fillStyle=g; ctx.fillRect(0,HORIZON,W,H-HORIZON);
  // Sonnen-Reflexion
  const rg = ctx.createLinearGradient(0,HORIZON,0,H);
  rg.addColorStop(0,'rgba(255,220,150,.5)'); rg.addColorStop(1,'rgba(255,220,150,0)');
  ctx.fillStyle=rg;
  ctx.beginPath(); ctx.moveTo(W*.5-8,HORIZON); ctx.lineTo(W*.5+8,HORIZON);
  ctx.lineTo(W*.5+90,H); ctx.lineTo(W*.5-90,H); ctx.closePath(); ctx.fill();
  // perspektivische Wellenlinien (scrollen mit dist)
  ctx.lineWidth=2;
  for(let i=1;i<=26;i++){
    const dz = PLAYER_DZ + Math.pow(i/26,2)*(FAR) ;
    const phase = ((dist*0.6) % 220);
    const dz2 = PLAYER_DZ + ((Math.pow(i/26,2)*FAR) + phase) % FAR;
    const y = HORIZON + CAMH_FOCAL/dz2;
    const a = 0.06 + 0.05*Math.sin(i+dist*0.01);
    ctx.strokeStyle='rgba(180,235,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function drawSideMarkers(){
  // Kurs-Ränder als Reihe Pfosten
  for(let side=-1; side<=1; side+=2){
    for(let k=0;k<20;k++){
      const dz = PLAYER_DZ + ((k*260 - (dist%260)) + 260) ;
      if(dz<PLAYER_DZ||dz>FAR) continue;
      const p = project(dz, side*COURSE_HW - px);
      if(p.sy<HORIZON) continue;
      const s = Math.max(1,p.scale*70);
      ctx.fillStyle = side<0 ? 'rgba(255,90,80,.9)' : 'rgba(255,210,74,.9)';
      ctx.fillRect(p.sx-s*0.12, p.sy-s, s*0.24, s);
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.fillRect(p.sx-s*0.12, p.sy-s*0.7, s*0.24, s*0.14);
    }
  }
}

function drawObj(o){
  const p = project(o.dz, o.x - px);
  if(p.sy < HORIZON-2 || p.scale<=0) return;
  const s = p.scale;
  if(o.type==='gate'){
    drawBuoy(o.x-GATE_HALF, o.dz, '#ff5252', o.done && streakOK(o));
    drawBuoy(o.x+GATE_HALF, o.dz, '#ffd24a', false);
  } else if(o.type==='ring'){
    const R=Math.max(4,s*130);
    ctx.save(); ctx.translate(p.sx, p.sy - R*0.5);
    ctx.strokeStyle='#22d3ee'; ctx.lineWidth=Math.max(2,s*22);
    ctx.globalAlpha=.95;
    ctx.beginPath(); ctx.ellipse(0,0,R, R*0.42 + Math.sin(bob+o.ph)*R*0.05, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle='rgba(234,252,255,.6)'; ctx.lineWidth=Math.max(1,s*8);
    ctx.beginPath(); ctx.ellipse(0,0,R*0.98, R*0.40, 0, 0, 7); ctx.stroke();
    ctx.restore();
  } else if(o.type==='star'){
    drawStar(p.sx, p.sy - Math.max(6,s*60), Math.max(6,s*70), '#ffd24a');
  } else if(o.type==='ramp'){
    const w=Math.max(14,s*300), h=Math.max(8,s*120);
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(p.sx,p.sy+4,w*0.55,h*0.2,0,0,7); ctx.fill();
    ctx.fillStyle='#12405a';
    ctx.beginPath(); ctx.moveTo(p.sx-w/2,p.sy); ctx.lineTo(p.sx+w/2,p.sy);
    ctx.lineTo(p.sx+w/2,p.sy-h*0.4); ctx.lineTo(p.sx-w/2,p.sy-h); ctx.closePath(); ctx.fill();
    // Chevrons
    ctx.fillStyle='#ffd24a';
    for(let c=0;c<3;c++){ const yy=p.sy-h*0.15-c*h*0.22;
      ctx.beginPath(); ctx.moveTo(p.sx, yy-h*0.12); ctx.lineTo(p.sx+w*0.16, yy);
      ctx.lineTo(p.sx, yy+h*0.05); ctx.lineTo(p.sx-w*0.16, yy); ctx.closePath(); ctx.fill(); }
  } else if(o.type==='rock'){
    const w=Math.max(10,s*230), h=Math.max(8,s*160);
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(p.sx,p.sy+3,w*0.6,h*0.16,0,0,7); ctx.fill();
    ctx.fillStyle='#4a5a63';
    ctx.beginPath();
    ctx.moveTo(p.sx-w/2,p.sy); ctx.lineTo(p.sx-w*0.28,p.sy-h*0.85);
    ctx.lineTo(p.sx+w*0.1,p.sy-h); ctx.lineTo(p.sx+w*0.4,p.sy-h*0.6);
    ctx.lineTo(p.sx+w/2,p.sy); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#6b7b84';
    ctx.beginPath(); ctx.moveTo(p.sx-w*0.28,p.sy-h*0.85); ctx.lineTo(p.sx+w*0.1,p.sy-h);
    ctx.lineTo(p.sx+w*0.05,p.sy-h*0.5); ctx.closePath(); ctx.fill();
    // Schaum am Fuß
    ctx.fillStyle='rgba(234,252,255,.5)';
    ctx.beginPath(); ctx.ellipse(p.sx,p.sy,w*0.55,h*0.1,0,0,7); ctx.fill();
  }
}
function streakOK(){ return true; }

function drawBuoy(worldX, dz, color, hit){
  const p = project(dz, worldX - px);
  if(p.sy<HORIZON) return;
  const s = Math.max(3, p.scale*150);
  ctx.save(); ctx.translate(p.sx, p.sy);
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, s*0.06, s*0.34, s*0.12, 0,0,7); ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,-s*0.9); ctx.lineTo(s*0.3,s*0.05); ctx.lineTo(-s*0.3,s*0.05); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillRect(-s*0.3,-s*0.12,s*0.6,s*0.14);
  // Fähnchen-Highlight
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.moveTo(0,-s*0.9); ctx.lineTo(s*0.08,-s*0.4); ctx.lineTo(-s*0.05,-s*0.4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawStar(x,y,r,c){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle=c;
  ctx.shadowColor=c; ctx.shadowBlur=r*0.4;
  ctx.beginPath();
  for(let i=0;i<10;i++){ const ang=-Math.PI/2 + i*Math.PI/5; const rr = i%2? r*0.45 : r;
    ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c||'rgba(234,252,255,.9)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const base = project(PLAYER_DZ, 0);
  let x = W/2;
  let y = base.sy - 6 + Math.sin(bob)*4;
  // Sprunghöhe
  let lift = 0;
  if(air>0){ const t = airT/1.15; lift = Math.sin(Math.min(1,t)*Math.PI) * 150; }
  const dir = ((keys.ArrowRight||keys._t==='R')?1:0) - ((keys.ArrowLeft||keys._t==='L')?1:0);
  ctx.save();
  ctx.translate(x, y - lift);
  ctx.rotate(dir*0.16);
  const s = 1.15;
  ctx.scale(s,s);
  // Schatten (kleiner wenn in der Luft)
  ctx.fillStyle='rgba(0,0,0,'+(0.28*(1-lift/160)).toFixed(2)+')';
  ctx.beginPath(); ctx.ellipse(0, 30+lift*0.4, 34*(1-lift/300), 12*(1-lift/300), 0,0,7); ctx.fill();
  // Wasserspritzer vorne
  if(air<=0){
    ctx.fillStyle='rgba(234,252,255,.55)';
    ctx.beginPath(); ctx.ellipse(0,26,30,10,0,0,7); ctx.fill();
  }
  // Rumpf
  const hull = ctx.createLinearGradient(0,-46,0,34);
  hull.addColorStop(0,'#ff9a4a'); hull.addColorStop(1,'#e2511f');
  ctx.fillStyle=hull;
  ctx.beginPath();
  ctx.moveTo(0,-46); ctx.quadraticCurveTo(26,-8,20,34);
  ctx.lineTo(-20,34); ctx.quadraticCurveTo(-26,-8,0,-46); ctx.closePath(); ctx.fill();
  // Streifen
  ctx.fillStyle='#eafcff';
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(8,26); ctx.lineTo(-8,26); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#22d3ee';
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(4,20); ctx.lineTo(-4,20); ctx.closePath(); ctx.fill();
  // Fahrer
  ctx.fillStyle='#0b2a36';
  ctx.beginPath(); ctx.arc(0,-4,9,0,7); ctx.fill();
  ctx.fillStyle='#ffd24a';
  ctx.beginPath(); ctx.arc(0,-4,9,Math.PI*1.15,Math.PI*1.85); ctx.fill(); // Helm-Visier
  ctx.fillStyle='#14454f';
  ctx.beginPath(); ctx.moveTo(-9,6); ctx.quadraticCurveTo(0,2,9,6); ctx.lineTo(7,24); ctx.lineTo(-7,24); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign='left';
  ctx.font='900 italic 40px "Arial Black",sans-serif';
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillText(score, 34, 58);
  ctx.fillStyle='#fff'; ctx.fillText(score, 30, 54);
  ctx.font='bold 16px "Trebuchet MS",sans-serif';
  ctx.fillStyle='var(--slate)'; ctx.fillStyle='#9fc6d6'; ctx.fillText('PUNKTE', 32, 76);

  // Timer
  ctx.textAlign='right';
  ctx.font='900 italic 34px "Arial Black",sans-serif';
  ctx.fillStyle = timeLeft<10 ? '#ff6b6b' : '#fff';
  ctx.fillText(timeLeft.toFixed(1)+'s', W-30, 50);
  // Balken
  const bw=W-64;
  ctx.fillStyle='rgba(255,255,255,.14)'; roundRect(32,64,bw,10,5); ctx.fill();
  ctx.fillStyle = timeLeft<10 ? '#ff6b6b' : '#22d3ee';
  roundRect(32,64,bw*(timeLeft/GAME_TIME),10,5); ctx.fill();

  if(streak>=3){
    ctx.textAlign='center';
    ctx.font='900 italic 26px "Arial Black",sans-serif';
    ctx.fillStyle='#ffd24a';
    ctx.fillText('🔥 STREAK ×'+streak, W/2, 50);
  }
  if(air>0){
    ctx.textAlign='center'; ctx.font='900 italic 30px "Arial Black",sans-serif';
    ctx.fillStyle='#ffd24a'; ctx.fillText('✈ BIG AIR', W/2, 100);
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---------- Ablauf / Screens ----------
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
const nameInput   = document.getElementById('name');

function startGame(){
  playerName = (nameInput.value.trim() || 'Gast').slice(0,14);
  reset(); state='play';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  cv.focus(); window.focus();
}
function endGame(){
  state='over';
  const rank = saveScore(playerName, score);
  document.getElementById('finalScore').textContent = score + ' Pkt';
  document.getElementById('newHi').classList.toggle('hidden', !(rank===1 && score>0));
  renderBoard(playerName, score);
  overScreen.classList.remove('hidden');
}

// ---------- Leaderboard ----------
function loadBoard(){
  try{ return JSON.parse(localStorage.getItem(LB_KEY)) || []; }catch(e){ return []; }
}
function saveScore(name, sc){
  const b = loadBoard();
  const entry = {name, score:sc, at:Date.now()};
  b.push(entry);
  b.sort((a,z)=>z.score-a.score);
  const top = b.slice(0,50);
  try{ localStorage.setItem(LB_KEY, JSON.stringify(top)); }catch(e){}
  return top.indexOf(entry)+1 || (top.findIndex(e=>e.name===name&&e.score===sc)+1);
}
function renderBoard(hlName, hlScore){
  const b = loadBoard().slice(0,10);
  const el = document.getElementById('boardList');
  el.innerHTML = '';
  let highlighted=false;
  b.forEach((e,i)=>{
    const row = document.createElement('div');
    const me = (!highlighted && e.name===hlName && e.score===hlScore);
    if(me) highlighted=true;
    row.className = 'lb' + (i<3?' gold':'') + (me?' me':'');
    const medal = ['🥇','🥈','🥉'][i] || (i+1)+'.';
    row.innerHTML = '<span class="rk">'+medal+'</span>'+
                    '<span class="nm">'+escapeHtml(e.name)+'</span>'+
                    '<span class="sc">'+e.score+'</span>';
    el.appendChild(row);
  });
  if(b.length===0) el.innerHTML='<div class="lb"><span></span><span class="nm" style="color:#9fc6d6">Noch keine Einträge – sei die/der Erste!</span><span></span></div>';
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// CSV-Export (nutzt downloads-Fähigkeit, sonst Fallback)
async function exportCsv(){
  const b = loadBoard();
  let csv = 'Rang,Name,Punkte,Datum\n';
  b.forEach((e,i)=>{ const d=new Date(e.at).toLocaleString('de-DE');
    csv += (i+1)+',"'+String(e.name).replace(/"/g,'""')+'",'+e.score+',"'+d+'"\n'; });
  const fname = 'wave-rush-bestenliste.csv';
  try{
    if(window.claude && window.claude.downloads && window.claude.downloads.save){
      await window.claude.downloads.save({filename:fname, data:csv});
      return;
    }
  }catch(e){ /* Nutzer hat evtl. abgelehnt */ }
  // Fallback: Blob-Download
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

// ---------- Buttons ----------
document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('csvBtn').onclick   = exportCsv;
document.getElementById('menuBtn').onclick  = ()=>{
  state='menu'; overScreen.classList.add('hidden'); startScreen.classList.remove('hidden'); nameInput.focus();
};
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(); });

// Start
nameInput.focus();
reset();
requestAnimationFrame(loop);
})();
</script>
